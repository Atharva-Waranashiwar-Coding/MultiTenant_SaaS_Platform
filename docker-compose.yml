version: '3.9'

# ─────────────────────────────────────────────────────────
# MultiTenant SaaS Admin Platform — Local Dev Stack
# ─────────────────────────────────────────────────────────
# Services:
#   db       — PostgreSQL 15
#   api      — NestJS backend (port 4000)
#   web      — Next.js frontend (port 3000)
#
# Usage:
#   docker-compose up -d db       ← start only the database
#   docker-compose up             ← start everything
# ─────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
      POSTGRES_DB: saas_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── NestJS API ──────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: saas_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://saas_user:saas_password@db:5432/saas_platform_db
      JWT_SECRET: local-dev-secret-change-in-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 7
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src   # hot reload in dev
      - ./apps/api/prisma:/app/prisma

  # ── Next.js Web ─────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: saas_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  postgres_data:
